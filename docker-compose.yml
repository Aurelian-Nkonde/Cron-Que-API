services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cron-que
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thousand
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=cron-que;Username=postgres;Password=thousand;"
    ports:
      - "8080:8080"

  web:
    build:
      context: ../cron-que-ui
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dv3jppdty
        NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: cron-que-preset
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
